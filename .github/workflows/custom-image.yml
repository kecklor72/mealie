# Builds this fork (Mealie + per-user theme manager) and publishes it to
# GitHub Container Registry as ghcr.io/<your-github-user>/mealie:themes
#
# Runs on every push to the `themes` branch, and can be started manually from
# the Actions tab ("Run workflow").
name: Build custom Mealie image

on:
  push:
    branches: [themes]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (add linux/arm64 for Raspberry Pi / ARM servers, slower)"
        default: "linux/amd64"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mealie" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:themes
            ${{ steps.image.outputs.name }}:themes-${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
